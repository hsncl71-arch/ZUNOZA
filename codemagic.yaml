workflows:
  zunoza-ios-app-store:
    name: ZUNOZA iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ZUNOZA
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zunoza.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.zunoza.app"
      node: 22
    scripts:
      - name: Install JS deps
        script: npm ci --ignore-scripts
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Archive
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
